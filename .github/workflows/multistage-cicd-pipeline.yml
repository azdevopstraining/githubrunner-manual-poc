name: 'Terraform CI/CD'

## One GitHub job = one Container Apps executor.
# Each `jobs:` entry is a new runner. This runner image is ephemeral, so four
# jobs meant four replicas. All stages are steps in a single job instead.
#
# PRs: fmt, validate, Checkov, plan. No apply.
# Push to main: then apply dev, staging, production in this same executor.
# Manual run: then apply only the selected environment.
#
# Runner: github-actions-runner-job, label ci, repo terraform-poc.
# Do not use ubuntu-latest, self-hosted, or Docker container actions.
#
# Secrets: GitHub Environment named in `environment:` below (dev on PR/push;
# the chosen env on workflow_dispatch).
#   AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID
#   TF_STATE_RESOURCE_GROUP, TF_STATE_STORAGE_ACCOUNT
#   TF_STATE_CONTAINER — optional, defaults to tfstate
#   STORAGE_ACCOUNT_NAME — optional override of params/*.tfvars
on:
  push:
    branches:
    - main
  pull_request:
    branches:
    - main
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        type: choice
        options: [dev, staging, production]

env:
  TERRAFORM_VERSION: "1.10.5"
  AZURERM_PROVIDER_VERSION: "4.37.0"
  ARM_USE_OIDC: true
  ARM_USE_AZUREAD: true
  ARM_STORAGE_USE_AZUREAD: true
  ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  TF_STATE_RESOURCE_GROUP: ${{ secrets.TF_STATE_RESOURCE_GROUP }}
  TF_STATE_STORAGE_ACCOUNT: ${{ secrets.TF_STATE_STORAGE_ACCOUNT }}
  TF_STATE_CONTAINER: ${{ secrets.TF_STATE_CONTAINER }}

permissions:
  id-token: write
  contents: read
  pull-requests: write

jobs:
  pipeline:
    name: 'Lint, plan, and deploy'
    runs-on: [ci]
    # One job can attach only one GitHub Environment. PR/push use dev secrets.
    # Manual run uses the environment you selected.
    environment: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.environment || 'dev' }}
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install CI tools
      env:
        INSTALL_AZURE_CLI: "true"
      run: bash scripts/install-ci-tools.sh

    - name: Terraform fmt
      run: terraform fmt -check -recursive

    - name: Terraform init (no backend)
      run: terraform init -backend=false -input=false

    - name: Terraform Validate
      run: terraform validate -no-color

    - name: Run Checkov
      id: checkov
      run: |
        uv tool install "checkov==3.3.17"
        checkov -d . \
          --framework terraform \
          --skip-check CKV_AZURE_33,CKV2_AZURE_21,CKV_AZURE_43,CKV_AZURE_206,CKV2_AZURE_1,CKV2_AZURE_33 \
          --output cli \
          --output sarif \
          --output-file-path .
        if [ -f results_sarif.sarif ]; then
          mv -f results_sarif.sarif results.sarif
        fi

    - name: Upload Checkov SARIF artifact
      if: success() || failure()
      uses: actions/upload-artifact@v4
      with:
        name: checkov-sarif
        path: results.sarif
        if-no-files-found: warn

    - name: Check Azure OIDC secrets
      run: |
        if [ -z "${{ secrets.AZURE_CLIENT_ID }}" ] || [ -z "${{ secrets.AZURE_TENANT_ID }}" ] || [ -z "${{ secrets.AZURE_SUBSCRIPTION_ID }}" ]; then
          echo "::error::GitHub Environment is missing AZURE_CLIENT_ID, AZURE_TENANT_ID, or AZURE_SUBSCRIPTION_ID."
          exit 1
        fi

    - name: Check Terraform state backend secrets
      run: |
        if [ -z "${TF_STATE_RESOURCE_GROUP}" ] || [ -z "${TF_STATE_STORAGE_ACCOUNT}" ]; then
          echo "::error::GitHub Environment is missing TF_STATE_RESOURCE_GROUP or TF_STATE_STORAGE_ACCOUNT. TF_STATE_CONTAINER is optional and defaults to tfstate."
          exit 1
        fi

    - name: 'Az CLI login'
      uses: azure/login@v3
      with:
        client-id: ${{ secrets.AZURE_CLIENT_ID }}
        tenant-id: ${{ secrets.AZURE_TENANT_ID }}
        subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

    - name: Terraform init (dev state)
      run: |
        terraform init -input=false -reconfigure \
          -backend-config="resource_group_name=${TF_STATE_RESOURCE_GROUP}" \
          -backend-config="storage_account_name=${TF_STATE_STORAGE_ACCOUNT}" \
          -backend-config="container_name=${TF_STATE_CONTAINER:-tfstate}" \
          -backend-config="key=dev.terraform.tfstate" \
          -backend-config="use_azuread_auth=true" \
          -backend-config="use_oidc=true"

    - name: Terraform Plan (dev)
      env:
        STORAGE_ACCOUNT_NAME: ${{ secrets.STORAGE_ACCOUNT_NAME }}
      run: |
        extra=()
        if [ -n "${STORAGE_ACCOUNT_NAME:-}" ]; then
          extra+=(-var "storage_account_name=${STORAGE_ACCOUNT_NAME}")
        fi
        terraform plan \
          -input=false \
          -no-color \
          -var-file=params/dev.tfvars \
          "${extra[@]}" \
          -out=tfplan
        terraform show -no-color tfplan > plan.txt

    - name: Create String Output
      id: plan-string
      run: |
        PLAN=$(cat plan.txt)
        delimiter="$(openssl rand -hex 8)"
        echo "summary<<${delimiter}" >> $GITHUB_OUTPUT
        echo "## Terraform plan (dev)" >> $GITHUB_OUTPUT
        echo "<details><summary>Click to expand</summary>" >> $GITHUB_OUTPUT
        echo "" >> $GITHUB_OUTPUT
        echo '```' >> $GITHUB_OUTPUT
        echo "$PLAN" >> $GITHUB_OUTPUT
        echo '```' >> $GITHUB_OUTPUT
        echo "</details>" >> $GITHUB_OUTPUT
        echo "${delimiter}" >> $GITHUB_OUTPUT

    - name: Publish Plan to Task Summary
      env:
        SUMMARY: ${{ steps.plan-string.outputs.summary }}
      run: |
        echo "$SUMMARY" >> $GITHUB_STEP_SUMMARY

    - name: Push Plan Output to PR
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v7
      env:
        SUMMARY: "${{ steps.plan-string.outputs.summary }}"
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        script: |
          const body = `${process.env.SUMMARY}`;
          github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
          })

    - name: Terraform apply
      if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
      env:
        EVENT_NAME: ${{ github.event_name }}
        TARGET_ENV: ${{ github.event.inputs.environment }}
        STORAGE_ACCOUNT_NAME: ${{ secrets.STORAGE_ACCOUNT_NAME }}
      run: |
        set -euo pipefail
        targets=()
        if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
          targets+=("${TARGET_ENV}")
        else
          targets+=(dev staging production)
        fi

        extra=()
        if [ -n "${STORAGE_ACCOUNT_NAME:-}" ]; then
          extra+=(-var "storage_account_name=${STORAGE_ACCOUNT_NAME}")
        fi

        for env_name in "${targets[@]}"; do
          params="params/${env_name}.tfvars"
          if [ "$env_name" = "production" ]; then
            params="params/prod.tfvars"
          fi
          echo "::group::Apply ${env_name} (${params})"
          terraform init -input=false -reconfigure \
            -backend-config="resource_group_name=${TF_STATE_RESOURCE_GROUP}" \
            -backend-config="storage_account_name=${TF_STATE_STORAGE_ACCOUNT}" \
            -backend-config="container_name=${TF_STATE_CONTAINER:-tfstate}" \
            -backend-config="key=${env_name}.terraform.tfstate" \
            -backend-config="use_azuread_auth=true" \
            -backend-config="use_oidc=true"
          terraform plan \
            -input=false \
            -no-color \
            -var-file="${params}" \
            "${extra[@]}" \
            -out=tfplan
          terraform apply -input=false -auto-approve tfplan
          echo "::endgroup::"
        done
