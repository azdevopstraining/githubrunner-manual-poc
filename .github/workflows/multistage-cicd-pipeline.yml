name: 'Terraform CI/CD'

# Manual runs only. Actions → Terraform CI/CD → Run workflow, then choose
# dev, staging, or production.
#
# One job so checkout and tool install run once. Lint steps are named
# "Lint — ..." and run before plan and apply.
# If the GitHub Environment has required reviewers, that approval happens
# before the job starts, including the lint steps.
#
# Runner: Container Apps job, label ci. No Docker container actions
# (this image has no Docker daemon).
# Secrets live on GitHub Environments named dev, staging, and production:
#   AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID
#   TF_STATE_RESOURCE_GROUP, TF_STATE_STORAGE_ACCOUNT
#   TF_STATE_CONTAINER (optional, defaults to tfstate)

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        type: choice
        options: [dev, staging, production]

env:
  TERRAFORM_VERSION: "1.10.5"
  AZURERM_PROVIDER_VERSION: "4.37.0"
  ARM_USE_OIDC: true
  ARM_USE_AZUREAD: true
  ARM_STORAGE_USE_AZUREAD: true

permissions:
  id-token: write
  contents: read

jobs:
  cicd:
    name: 'Lint and deploy ${{ inputs.environment }}'
    runs-on: [ci]
    environment: ${{ inputs.environment }}
    env:
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      TF_STATE_RESOURCE_GROUP: ${{ secrets.TF_STATE_RESOURCE_GROUP }}
      TF_STATE_STORAGE_ACCOUNT: ${{ secrets.TF_STATE_STORAGE_ACCOUNT }}
      TF_STATE_CONTAINER: ${{ secrets.TF_STATE_CONTAINER }}
      TF_VAR_FILE: params/${{ inputs.environment == 'production' && 'prod' || inputs.environment }}.tfvars
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install CI tools
      env:
        INSTALL_AZURE_CLI: "true"
      run: bash scripts/install-ci-tools.sh

    - name: Lint — terraform fmt
      run: terraform fmt -check -recursive

    - name: Lint — Checkov
      run: |
        uv tool install "checkov==3.3.17"
        checkov -d . \
          --framework terraform \
          --skip-check CKV_AZURE_33,CKV2_AZURE_21,CKV_AZURE_43,CKV_AZURE_206,CKV2_AZURE_1,CKV2_AZURE_33

    - name: Az CLI login
      uses: azure/login@v3
      with:
        client-id: ${{ secrets.AZURE_CLIENT_ID }}
        tenant-id: ${{ secrets.AZURE_TENANT_ID }}
        subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

    - name: Terraform init
      run: |
        terraform init -input=false -reconfigure \
          -backend-config="resource_group_name=${TF_STATE_RESOURCE_GROUP}" \
          -backend-config="storage_account_name=${TF_STATE_STORAGE_ACCOUNT}" \
          -backend-config="container_name=${TF_STATE_CONTAINER:-tfstate}" \
          -backend-config="key=${{ inputs.environment }}.terraform.tfstate" \
          -backend-config="use_azuread_auth=true" \
          -backend-config="use_oidc=true"

    - name: Lint — terraform validate
      run: terraform validate -no-color

    - name: Terraform plan
      run: terraform plan -input=false -no-color -var-file="${TF_VAR_FILE}" -out=tfplan

    - name: Terraform apply
      run: terraform apply -input=false -auto-approve tfplan
